<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reverie">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat · Reverie</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    body, html { height: 100%; overflow: hidden; }
    .app-frame  { display: flex; flex-direction: column; height: 100dvh; }

    /* ── HEADER ── */
    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px 12px; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .back-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-size: 17px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none;
    }
    .chat-title-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .chat-title      { font-size: 16px; font-weight: 700; color: var(--text); }
    .chat-subtitle   { font-size: 11px; color: var(--text-dim); }
    .new-chat-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-dim); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    /* ── CHAT AREA ── */
    .chat-area {
      flex: 1; overflow-y: auto; padding: 16px 14px;
      display: flex; flex-direction: column; gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    /* ── BUBBLES ── */
    .bubble-row      { display: flex; }
    .bubble-row.ai   { justify-content: flex-start; }
    .bubble-row.user { justify-content: flex-end; }
    .bubble {
      max-width: 80%; padding: 11px 15px; border-radius: 18px;
      font-size: 14px; line-height: 1.65; word-break: break-word;
    }
    .bubble.ai {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-bottom-left-radius: 4px;
    }
    .bubble.user {
      background: linear-gradient(135deg, #7c3aed, #9b5de5);
      color: #fff; border-bottom-right-radius: 4px;
    }
    .bubble-enter { animation: bubble-in 0.22s ease; }
    @keyframes bubble-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── TYPING ── */
    .typing-bubble {
      display: flex; gap: 5px; align-items: center;
      padding: 13px 17px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; border-bottom-left-radius: 4px;
      width: fit-content;
    }
    .typing-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,0.3);
      animation: bounce-dot 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce-dot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ── DREAM PROMPT CHIP ── */
    .dream-chip {
      align-self: center; margin: 4px 0;
      padding: 8px 16px; border-radius: 20px;
      background: rgba(124,58,237,0.12); border: 1px solid rgba(124,58,237,0.22);
      color: var(--accent-soft); font-size: 12px; font-weight: 600;
      cursor: pointer; text-decoration: none;
      animation: bubble-in 0.22s ease;
    }
    .dream-chip:hover { background: rgba(124,58,237,0.2); }

    /* ── FOOTER ── */
    .chat-footer {
      flex-shrink: 0; padding: 10px 12px env(safe-area-inset-bottom, 16px);
      border-top: 1px solid var(--border); background: var(--bg);
    }
    .input-bar { display: flex; align-items: flex-end; gap: 8px; }
    .mic-btn, .send-btn {
      width: 42px; height: 42px; border-radius: 50%; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.18s;
    }
    .mic-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-dim); font-size: 17px;
    }
    .mic-btn.recording { background: rgba(239,68,68,0.15); color: #ef4444; border-color: rgba(239,68,68,0.35); }
    .send-btn {
      background: linear-gradient(135deg, #7c3aed, #9b5de5); color: #fff;
    }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .chat-input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 11px 15px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      resize: none; outline: none; max-height: 110px;
      line-height: 1.5; transition: border-color 0.2s;
      overflow-y: auto;
    }
    .chat-input:focus { border-color: rgba(155,93,229,0.5); }
    .chat-input::placeholder { color: var(--text-dim); }
  </style>
</head>
<body>
<div class="app-frame">

  <div class="chat-header">
    <a class="back-btn" href="../index.html">←</a>
    <div class="chat-title-wrap">
      <span class="chat-title">Reverie</span>
      <span class="chat-subtitle" id="chat-subtitle">here for you</span>
    </div>
    <button class="new-chat-btn" onclick="newChat()" title="New chat">↺</button>
  </div>

  <div class="chat-area" id="chat-area"></div>

  <div class="chat-footer">
    <div class="input-bar">
      <button class="mic-btn" id="mic-btn" onclick="toggleMic()">🎤</button>
      <textarea class="chat-input" id="chat-input" placeholder="what's on your mind..." rows="1"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script src="../js/app.js"></script>
<script src="../js/api.js"></script>
<script type="module">
  import { requireAuth }              from '../js/auth.js';
  import { saveGeneralChatSession }   from '../js/firebase.js';

  const BASE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
    ? 'http://127.0.0.1:8000'
    : 'https://reverie-aiproject.onrender.com';

  let chatHistory = [];
  let currentUser = null;
  let isLoading   = false;
  let dreamCount  = 0;
  let mediaRec    = null;
  let audioChunks = [];
  let recording   = false;

  requireAuth(user => { currentUser = user; });

  const ta = document.getElementById('chat-input');
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 110) + 'px';
    document.getElementById('send-btn').disabled = !ta.value.trim();
  });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function addBubble(text, type) {
    const area = document.getElementById('chat-area');
    const row  = document.createElement('div');
    row.className = `bubble-row ${type}`;
    const b = document.createElement('div');
    b.className = `bubble ${type} bubble-enter`;
    b.textContent = text;
    row.appendChild(b);
    area.appendChild(row);
    area.scrollTop = area.scrollHeight;
  }

  function addDreamChip() {
    const area = document.getElementById('chat-area');
    const chip = document.createElement('a');
    chip.className   = 'dream-chip bubble-enter';
    chip.href        = 'dream-chat.html';
    chip.textContent = '🌙 Log this as a dream →';
    area.appendChild(chip);
    area.scrollTop = area.scrollHeight;
  }

  function showTyping() {
    const area = document.getElementById('chat-area');
    const row  = document.createElement('div');
    row.className = 'bubble-row ai';
    row.id = 'typing-row';
    const t = document.createElement('div');
    t.className = 'typing-bubble';
    t.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
    row.appendChild(t);
    area.appendChild(row);
    area.scrollTop = area.scrollHeight;
  }

  function hideTyping() { document.getElementById('typing-row')?.remove(); }

  async function authHeaders() {
    if (!currentUser) return { 'Content-Type': 'application/json' };
    const token = await currentUser.getIdToken();
    return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
  }

  window.sendMessage = async function() {
    if (isLoading) return;
    const message = ta.value.trim();
    if (!message) return;

    ta.value = '';
    ta.style.height = 'auto';
    document.getElementById('send-btn').disabled = true;

    addBubble(message, 'user');
    const historyBefore = [...chatHistory];
    chatHistory.push({ role: 'user', content: message });

    const lowerMsg = message.toLowerCase();
    const mentionsDream = /dream|dreamed|dreamt|nightmare|sleep/.test(lowerMsg);
    if (mentionsDream) dreamCount++;

    isLoading = true;
    showTyping();

    try {
      const res = await fetch(`${BASE_URL}/dreams/general-chat`, {
        method:  'POST',
        headers: await authHeaders(),
        body:    JSON.stringify({ message, history: historyBefore }),
      });
      if (!res.ok) throw new Error();
      const data = await res.json();
      hideTyping();
      addBubble(data.reply, 'ai');
      chatHistory.push({ role: 'assistant', content: data.reply });

      if (dreamCount >= 2 && chatHistory.length === 6) {
        addDreamChip();
      }

      if (chatHistory.length % 4 === 0 && currentUser) {
        saveGeneralChatSession(currentUser.uid, chatHistory).catch(() => {});
      }

      const sub = document.getElementById('chat-subtitle');
      if (sub) sub.textContent = dreamCount >= 2 ? 'dream mode' : 'here for you';

    } catch {
      hideTyping();
      addBubble("I'm here — what were you saying?", 'ai');
      chatHistory.push({ role: 'assistant', content: "I'm here — what were you saying?" });
    }
    isLoading = false;
  };

  window.newChat = function() {
    if (currentUser && chatHistory.length > 2) {
      saveGeneralChatSession(currentUser.uid, chatHistory).catch(() => {});
    }
    chatHistory = [];
    dreamCount  = 0;
    document.getElementById('chat-area').innerHTML = '';
    document.getElementById('chat-subtitle').textContent = 'here for you';
    initChat();
  };

  window.toggleMic = async function() {
    const btn = document.getElementById('mic-btn');
    if (recording) { mediaRec?.stop(); recording = false; return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRec    = new MediaRecorder(stream, { mimeType: 'audio/webm' });
      audioChunks = [];
      mediaRec.ondataavailable = e => audioChunks.push(e.data);
      mediaRec.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        btn.textContent = '⏳';
        btn.classList.remove('recording');
        try {
          const blob   = new Blob(audioChunks, { type: 'audio/webm' });
          const result = await transcribeAudio(blob);
          ta.value = result.text;
          ta.dispatchEvent(new Event('input'));
          sendMessage();
        } catch { /* silent */ }
        btn.textContent = '🎤';
      };
      mediaRec.start();
      recording = true;
      btn.classList.add('recording');
      btn.textContent = '⏹';
    } catch {
      alert('Microphone access is needed for voice input.');
    }
  };

  async function initChat() {
    showTyping();
    try {
      const res = await fetch(`${BASE_URL}/dreams/general-chat`, {
        method:  'POST',
        headers: await authHeaders(),
        body:    JSON.stringify({ message: '', history: [] }),
      });
      if (!res.ok) throw new Error();
      const data = await res.json();
      hideTyping();
      addBubble(data.reply, 'ai');
      chatHistory.push({ role: 'assistant', content: data.reply });
    } catch {
      hideTyping();
      const fallback = "Hey — what's on your mind?";
      addBubble(fallback, 'ai');
      chatHistory.push({ role: 'assistant', content: fallback });
    }
  }

  initChat();
</script>
</body>
</html>
