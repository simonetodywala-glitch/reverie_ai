<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reverie">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat · Reverie</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/components.css">
  <style>
    body, html { height: 100%; overflow: hidden; }
    .app-frame  { display: flex; flex-direction: column; height: 100dvh; }

    /* ── HEADER ── */
    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px 12px; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .hdr-btn {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      text-decoration: none; font-size: 17px; flex-shrink: 0;
    }
    .chat-title-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .chat-title      { font-size: 16px; font-weight: 700; color: var(--text); }
    .chat-subtitle   { font-size: 11px; color: var(--text-dim); }

    /* ── SIDEBAR OVERLAY ── */
    .sidebar-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.45); z-index: 100;
    }
    .sidebar-overlay.open { display: block; }

    /* ── SIDEBAR PANEL ── */
    .sidebar {
      position: fixed; top: 0; right: 0; height: 100%;
      width: min(82%, 300px);
      background: var(--bg); border-left: 1px solid var(--border);
      z-index: 101;
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex; flex-direction: column;
      padding-top: env(safe-area-inset-top, 0);
    }
    .sidebar.open { transform: translateX(0); }

    .sidebar-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px; border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .sidebar-title { font-size: 16px; font-weight: 700; color: var(--text); }
    .sidebar-close {
      background: none; border: none; color: var(--text-dim);
      font-size: 22px; cursor: pointer; line-height: 1;
      padding: 0; width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
    }

    .new-chat-row {
      padding: 12px 16px; border-bottom: 1px solid var(--border);
    }
    .new-chat-row-btn {
      width: 100%; padding: 10px; border-radius: 12px;
      background: rgba(124,58,237,0.1); border: 1px solid rgba(124,58,237,0.2);
      color: var(--accent-soft); font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: 'DM Sans', sans-serif;
    }

    .sidebar-body { flex: 1; overflow-y: auto; padding: 8px 0; }

    .history-section-label {
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--text-dim);
      padding: 14px 18px 6px;
    }
    .history-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 18px; cursor: pointer;
      transition: background 0.15s;
    }
    .history-item:hover { background: var(--surface); }
    .history-item:active { background: var(--card); }
    .history-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }
    .history-info { flex: 1; min-width: 0; }
    .history-title {
      font-size: 13px; color: var(--text); font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .history-date { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .history-empty { font-size: 13px; color: var(--text-dim); padding: 8px 18px; }

    /* ── CHAT AREA ── */
    .chat-area {
      flex: 1; overflow-y: auto; padding: 16px 14px;
      display: flex; flex-direction: column; gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    /* ── BUBBLES ── */
    .bubble-row      { display: flex; }
    .bubble-row.ai   { justify-content: flex-start; }
    .bubble-row.user { justify-content: flex-end; }
    .bubble {
      max-width: 80%; padding: 11px 15px; border-radius: 18px;
      font-size: 14px; line-height: 1.65; word-break: break-word;
    }
    .bubble.ai {
      background: var(--card); border: 1px solid var(--border);
      color: var(--text); border-bottom-left-radius: 4px;
    }
    .bubble.user {
      background: linear-gradient(135deg, #7c3aed, #9b5de5);
      color: #fff; border-bottom-right-radius: 4px;
    }
    .bubble-enter { animation: bubble-in 0.22s ease; }
    @keyframes bubble-in {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── TYPING ── */
    .typing-bubble {
      display: flex; gap: 5px; align-items: center;
      padding: 13px 17px;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 18px; border-bottom-left-radius: 4px;
      width: fit-content;
    }
    .typing-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: rgba(255,255,255,0.3);
      animation: bounce-dot 1.2s ease-in-out infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce-dot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
      30% { transform: translateY(-6px); opacity: 1; }
    }

    /* ── DREAM CHIP ── */
    .dream-chip {
      align-self: center; margin: 4px 0;
      padding: 8px 16px; border-radius: 20px;
      background: rgba(124,58,237,0.12); border: 1px solid rgba(124,58,237,0.22);
      color: var(--accent-soft); font-size: 12px; font-weight: 600;
      cursor: pointer; text-decoration: none;
      animation: bubble-in 0.22s ease;
    }

    /* ── FOOTER ── */
    .chat-footer {
      flex-shrink: 0; padding: 10px 12px env(safe-area-inset-bottom, 16px);
      border-top: 1px solid var(--border); background: var(--bg);
    }
    .input-bar { display: flex; align-items: flex-end; gap: 8px; }
    .mic-btn, .send-btn {
      width: 42px; height: 42px; border-radius: 50%; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: all 0.18s;
    }
    .mic-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-dim); font-size: 17px;
    }
    .mic-btn.recording { background: rgba(239,68,68,0.15); color: #ef4444; border-color: rgba(239,68,68,0.35); }
    .send-btn {
      background: linear-gradient(135deg, #7c3aed, #9b5de5); color: #fff;
    }
    .send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .chat-input {
      flex: 1; background: var(--surface); border: 1px solid var(--border);
      border-radius: 20px; padding: 11px 15px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 14px;
      resize: none; outline: none; max-height: 110px;
      line-height: 1.5; transition: border-color 0.2s;
      overflow-y: auto;
    }
    .chat-input:focus { border-color: rgba(155,93,229,0.5); }
    .chat-input::placeholder { color: var(--text-dim); }
  </style>
</head>
<body>
<div class="app-frame">

  <!-- History Sidebar Overlay -->
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

  <!-- History Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">History</span>
      <button class="sidebar-close" onclick="closeSidebar()">×</button>
    </div>
    <div class="new-chat-row">
      <button class="new-chat-row-btn" onclick="newChat(); closeSidebar();">+ New Chat</button>
    </div>
    <div class="sidebar-body">
      <div class="history-section-label">Dream Chats</div>
      <div id="dream-history"><div class="history-empty">No dream chats yet</div></div>
      <div class="history-section-label">General Chats</div>
      <div id="general-history"><div class="history-empty">No chats yet</div></div>
    </div>
  </div>

  <!-- Header -->
  <div class="chat-header">
    <a class="hdr-btn" href="../index.html">←</a>
    <div class="chat-title-wrap">
      <span class="chat-title">Reverie</span>
      <span class="chat-subtitle" id="chat-subtitle">here for you</span>
    </div>
    <button class="hdr-btn" onclick="openSidebar()" title="History">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
  </div>

  <div class="chat-area" id="chat-area"></div>

  <div class="chat-footer">
    <div class="input-bar">
      <button class="mic-btn" id="mic-btn" onclick="toggleMic()">🎤</button>
      <textarea class="chat-input" id="chat-input" placeholder="what's on your mind..." rows="1"></textarea>
      <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

</div>

<script src="../js/app.js"></script>
<script src="../js/api.js"></script>
<script type="module">
  import { requireAuth }                              from '../js/auth.js';
  import { saveGeneralChatSession, getRecentChatSessions, getDreams } from '../js/firebase.js';

  const BASE_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
    ? 'http://127.0.0.1:8000'
    : 'https://reverie-aiproject.onrender.com';

  let chatHistory = [];
  let currentUser = null;
  let isLoading   = false;
  let dreamCount  = 0;
  let mediaRec    = null;
  let audioChunks = [];
  let recording   = false;

  requireAuth(user => { currentUser = user; });

  const ta = document.getElementById('chat-input');
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = Math.min(ta.scrollHeight, 110) + 'px';
    document.getElementById('send-btn').disabled = !ta.value.trim();
  });
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function addBubble(text, type) {
    const area = document.getElementById('chat-area');
    const row  = document.createElement('div');
    row.className = `bubble-row ${type}`;
    const b = document.createElement('div');
    b.className = `bubble ${type} bubble-enter`;
    b.textContent = text;
    row.appendChild(b);
    area.appendChild(row);
    area.scrollTop = area.scrollHeight;
  }

  function addDreamChip() {
    const area = document.getElementById('chat-area');
    const chip = document.createElement('a');
    chip.className   = 'dream-chip bubble-enter';
    chip.href        = 'dream-chat.html';
    chip.textContent = '🌙 Log this as a dream →';
    area.appendChild(chip);
    area.scrollTop = area.scrollHeight;
  }

  function showTyping() {
    const area = document.getElementById('chat-area');
    const row  = document.createElement('div');
    row.className = 'bubble-row ai';
    row.id = 'typing-row';
    const t = document.createElement('div');
    t.className = 'typing-bubble';
    t.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
    row.appendChild(t);
    area.appendChild(row);
    area.scrollTop = area.scrollHeight;
  }

  function hideTyping() { document.getElementById('typing-row')?.remove(); }

  async function authHeaders() {
    if (!currentUser) return { 'Content-Type': 'application/json' };
    const token = await currentUser.getIdToken();
    return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` };
  }

  function fmtDate(ts) {
    if (!ts) return '';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    const now = new Date();
    const diff = (now - d) / 86400000;
    if (diff < 1) return 'Today';
    if (diff < 2) return 'Yesterday';
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  // ── SIDEBAR ──
  window.openSidebar = async function() {
    document.getElementById('sidebar').classList.add('open');
    document.getElementById('sidebar-overlay').classList.add('open');
    if (currentUser) loadHistory();
  };

  window.closeSidebar = function() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('open');
  };

  async function loadHistory() {
    // Dream chats
    const dreamEl = document.getElementById('dream-history');
    try {
      const allDreams = await getDreams(currentUser.uid);
      const dreamChats = allDreams.filter(d => d.from_chat);
      if (dreamChats.length === 0) {
        dreamEl.innerHTML = '<div class="history-empty">No dream chats yet</div>';
      } else {
        dreamEl.innerHTML = dreamChats.slice(0, 8).map(d => `
          <div class="history-item" onclick="window.location.href='dream.html?id=${d.id}'">
            <span class="history-icon">🌙</span>
            <div class="history-info">
              <div class="history-title">${(d.text || d.summary || 'Dream').slice(0, 45)}…</div>
              <div class="history-date">${fmtDate(d.createdAt)}</div>
            </div>
          </div>`).join('');
      }
    } catch { dreamEl.innerHTML = '<div class="history-empty">Couldn\'t load</div>'; }

    // General chats
    const genEl = document.getElementById('general-history');
    try {
      const sessions = await getRecentChatSessions(currentUser.uid);
      if (sessions.length === 0) {
        genEl.innerHTML = '<div class="history-empty">No chats yet</div>';
      } else {
        genEl.innerHTML = sessions.map(s => {
          const firstUser = s.messages?.find(m => m.role === 'user')?.content || 'Chat';
          return `
          <div class="history-item" onclick="loadSession(${JSON.stringify(s.messages || [])})">
            <span class="history-icon">💬</span>
            <div class="history-info">
              <div class="history-title">${firstUser.slice(0, 45)}${firstUser.length > 45 ? '…' : ''}</div>
              <div class="history-date">${fmtDate(s.createdAt)}</div>
            </div>
          </div>`;
        }).join('');
      }
    } catch { genEl.innerHTML = '<div class="history-empty">Couldn\'t load</div>'; }
  }

  window.loadSession = function(messages) {
    closeSidebar();
    chatHistory = messages;
    dreamCount  = 0;
    const area  = document.getElementById('chat-area');
    area.innerHTML = '';
    messages.forEach(m => addBubble(m.content, m.role === 'user' ? 'user' : 'ai'));
  };

  // ── SEND ──
  window.sendMessage = async function() {
    if (isLoading) return;
    const message = ta.value.trim();
    if (!message) return;

    ta.value = '';
    ta.style.height = 'auto';
    document.getElementById('send-btn').disabled = true;

    addBubble(message, 'user');
    const historyBefore = [...chatHistory];
    chatHistory.push({ role: 'user', content: message });

    if (/dream|dreamed|dreamt|nightmare|sleep/.test(message.toLowerCase())) dreamCount++;

    isLoading = true;
    showTyping();

    try {
      const res = await fetch(`${BASE_URL}/dreams/general-chat`, {
        method:  'POST',
        headers: await authHeaders(),
        body:    JSON.stringify({ message, history: historyBefore }),
      });
      if (!res.ok) throw new Error();
      const data = await res.json();
      hideTyping();
      addBubble(data.reply, 'ai');
      chatHistory.push({ role: 'assistant', content: data.reply });

      if (dreamCount >= 2 && chatHistory.length === 6) addDreamChip();

      if (chatHistory.length % 4 === 0 && currentUser) {
        saveGeneralChatSession(currentUser.uid, chatHistory).catch(() => {});
      }

      const sub = document.getElementById('chat-subtitle');
      if (sub) sub.textContent = dreamCount >= 2 ? 'dream mode' : 'here for you';

    } catch {
      hideTyping();
      addBubble("I'm here — what were you saying?", 'ai');
      chatHistory.push({ role: 'assistant', content: "I'm here — what were you saying?" });
    }
    isLoading = false;
  };

  window.newChat = function() {
    if (currentUser && chatHistory.length > 2) {
      saveGeneralChatSession(currentUser.uid, chatHistory).catch(() => {});
    }
    chatHistory = [];
    dreamCount  = 0;
    document.getElementById('chat-area').innerHTML = '';
    document.getElementById('chat-subtitle').textContent = 'here for you';
    initChat();
  };

  window.toggleMic = async function() {
    const btn = document.getElementById('mic-btn');
    if (recording) { mediaRec?.stop(); recording = false; return; }
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRec    = new MediaRecorder(stream, { mimeType: 'audio/webm' });
      audioChunks = [];
      mediaRec.ondataavailable = e => audioChunks.push(e.data);
      mediaRec.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        btn.textContent = '⏳';
        btn.classList.remove('recording');
        try {
          const blob   = new Blob(audioChunks, { type: 'audio/webm' });
          const result = await transcribeAudio(blob);
          ta.value = result.text;
          ta.dispatchEvent(new Event('input'));
          sendMessage();
        } catch { /* silent */ }
        btn.textContent = '🎤';
      };
      mediaRec.start();
      recording = true;
      btn.classList.add('recording');
      btn.textContent = '⏹';
    } catch {
      alert('Microphone access is needed for voice input.');
    }
  };

  async function initChat() {
    showTyping();
    try {
      const res = await fetch(`${BASE_URL}/dreams/general-chat`, {
        method:  'POST',
        headers: await authHeaders(),
        body:    JSON.stringify({ message: '', history: [] }),
      });
      if (!res.ok) throw new Error();
      const data = await res.json();
      hideTyping();
      addBubble(data.reply, 'ai');
      chatHistory.push({ role: 'assistant', content: data.reply });
    } catch {
      hideTyping();
      const fallback = "Hey — what's on your mind?";
      addBubble(fallback, 'ai');
      chatHistory.push({ role: 'assistant', content: fallback });
    }
  }

  initChat();
</script>
</body>
</html>
